name: Smoke Web Image

on:
  push:
    branches:
      - feat/api-key-plans
    paths:
      - .github/workflows/smoke-web-image.yml

permissions:
  contents: read

jobs:
  smoke-web:
    runs-on: ubuntu-latest
    steps:
      - name: Pull web image
        run: docker pull gabrielsilva543/omniroute:3.8.69-web

      - name: Start with background Xvfb
        run: |
          set -euxo pipefail
          docker run -d --name omniroute-web-fixed -p 20128:20128             --entrypoint /app/check-permissions.sh             gabrielsilva543/omniroute:3.8.69-web             sh -lc 'Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & export DISPLAY=:99; exec node dev/run-standalone.mjs'

      - name: Verify health version and display
        run: |
          set -euxo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:20128/healthz; then
              echo HEALTHY
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:20128/healthz
          docker exec omniroute-web-fixed node -p "require('/app/package.json').version"
          docker exec omniroute-web-fixed sh -lc 'echo DISPLAY=$DISPLAY; kill -0 $(pgrep Xvfb) && echo XVFB_RUNNING'
          docker inspect -f '{{.State.Health.Status}}' omniroute-web-fixed
          docker logs --tail 200 omniroute-web-fixed

      - name: Dump on failure
        if: failure()
        run: |
          docker ps -a --no-trunc || true
          docker inspect omniroute-web-fixed || true
          docker logs omniroute-web-fixed || true
