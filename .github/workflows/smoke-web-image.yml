name: Smoke Web Image

on:
  push:
    branches:
      - feat/api-key-plans
    paths:
      - .github/workflows/smoke-web-image.yml

permissions:
  contents: read

jobs:
  smoke-web:
    runs-on: ubuntu-latest
    steps:
      - name: Pull web image
        run: docker pull gabrielsilva543/omniroute:3.8.70-web

      - name: Start web image
        run: |
          set -euxo pipefail
          docker run -d --name omniroute-web -p 20128:20128 gabrielsilva543/omniroute:3.8.70-web
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:20128/healthz; then
              echo HEALTHY
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:20128/healthz
          docker exec omniroute-web node -p "require('/app/package.json').version"

      - name: Test headed Chromium against chatgpt.com
        run: |
          set -euxo pipefail
          docker exec -e DISPLAY=:99 omniroute-web node --input-type=module -e '
            import { chromium } from "playwright";
            const t0 = Date.now();
            const browser = await chromium.launch({
              headless: false,
              args: ["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage","--window-position=-32000,-32000"]
            });
            console.log("LAUNCH_MS=" + (Date.now()-t0));
            const page = await browser.newPage();
            const t1 = Date.now();
            try {
              await page.goto("https://chatgpt.com/?temporary-chat=true", {waitUntil:"domcontentloaded", timeout:60000});
              console.log("GOTO_OK_MS=" + (Date.now()-t1));
            } catch (e) {
              console.log("GOTO_ERR_MS=" + (Date.now()-t1));
              console.log("GOTO_ERR=" + String(e));
            }
            console.log("URL=" + page.url());
            console.log("TITLE=" + await page.title().catch(()=>"(title-error)"));
            console.log("BODY_PREFIX=" + (await page.locator("body").innerText().catch(()=>"(body-error)")).slice(0,500).replace(/\n/g," | "));
            await browser.close();
          '

      - name: Dump on failure
        if: failure()
        run: |
          docker ps -a --no-trunc || true
          docker inspect omniroute-web || true
          docker logs omniroute-web || true
