name: Verify OmniRoute Custom Patches

on:
  push:
    branches:
      - feat/api-key-plans
    paths:
      - open-sse/utils/chatgptWebExecutorAdapter.ts
      - open-sse/utils/chatgptWebBrowserSession.ts
      - open-sse/utils/chatgptWebClientTools.ts
      - open-sse/utils/proxyFetch.ts
      - tests/unit/proxyfetch-direct-response-start-timeout-10214.test.ts
      - scripts/build/assembleStandalone.mjs
      - tests/unit/build/assemble-standalone.test.ts
      - src/proxy.ts
      - tests/unit/authz/proxy-matcher-case.test.ts
      - tests/unit/chatgpt-web-client-tools.test.ts
      - open-sse/executors/chatgpt-web.ts
      - open-sse/services/combo/executeTargetAttempt.ts
      - open-sse/services/combo.ts
      - open-sse/services/combo/comboCooldownRetry.ts
      - open-sse/handlers/chatCore/streamingPipeline.ts
      - open-sse/translator/response/openai-to-claude.ts
      - open-sse/handlers/responseTranslator.ts
      - tests/unit/translator-resp-openai-to-claude.test.ts
      - open-sse/services/identityMasking.ts
      - open-sse/services/combo/comboErrorAggregation.ts
      - open-sse/handlers/chatCore.ts
      - open-sse/executors/opencodeGeoBlock.ts
      - open-sse/services/opencodeFreeTierSkip.ts
      - open-sse/services/combo/comboPredicates.ts
      - open-sse/services/autoCombo/resilienceCandidateFilter.ts
      - open-sse/services/providerDefaultRateLimit.ts
      - open-sse/services/rateLimitManager.ts
      - open-sse/executors/default/nvidiaConcurrencyGate.ts
      - open-sse/executors/default.ts
      - open-sse/config/providers/registry/nvidia/index.ts
      - tests/unit/nvidia-tool-compatibility-2840.test.ts
      - src/sse/services/auth.ts
      - src/app/api/v1/models/catalog.ts
      - src/app/api/providers/[id]/models/route.ts
      - src/app/(dashboard)/dashboard/providers/[id]/ProviderDetailPageClient.tsx
      - src/app/(dashboard)/dashboard/providers/[id]/hooks/useModelImportHandlers.ts
      - src/app/(dashboard)/dashboard/providers/[id]/providerPageHelpers.ts
      - tests/unit/chatgpt-web-executor-adapter-cleanroom.test.ts
      - tests/unit/chatgpt-web-browser-session-cleanroom.test.ts
      - tests/unit/provider-models-route.test.ts
      - tests/unit/provider-page-hidden-modality-chat.test.ts
      - tests/unit/identity-masking.test.ts
      - tests/unit/combo-error-aggregation.test.ts
      - tests/unit/api-key-catalog-scope.test.ts
      - tests/unit/models-catalog-combo-access.test.ts
      - tests/unit/response-model-echo-1311.test.ts
      - tests/unit/opencode-free-tier-combo-scoped-failure-14313.test.ts
      - tests/unit/opencode-free-tier-noauth-ttl-skip-14313.test.ts
      - tests/unit/nvidia-quota-phase1.test.ts
      - tests/unit/rate-limit-provider-default.test.ts
      - .github/workflows/verify-custom-patches.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
      JWT_SECRET: "ci-focused-tests-jwt-secret-long-enough"
      API_KEY_SECRET: "ci-focused-tests-api-key-secret-long-enough"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: ./.github/actions/npm-ci-retry

      - name: Run focused unit tests
        run: |
          node --import tsx/esm \
            --import ./open-sse/utils/setupPolyfill.ts \
            --import ./tests/_setup/isolateDataDir.ts \
            --test --test-force-exit --test-concurrency=1 \
            tests/unit/chatgpt-web-executor-adapter-cleanroom.test.ts \
            tests/unit/chatgpt-web-browser-session-cleanroom.test.ts \
            tests/unit/build/assemble-standalone.test.ts \
            tests/unit/chatgpt-web-client-tools.test.ts \
            tests/unit/authz/proxy-matcher-case.test.ts \
            tests/unit/provider-models-route.test.ts \
            tests/unit/provider-page-hidden-modality-chat.test.ts \
            tests/unit/identity-masking.test.ts \
            tests/unit/combo-error-aggregation.test.ts \
            tests/unit/combo-cooldown-retry.test.ts \
            tests/unit/chatcore-streaming-pipeline.test.ts \
            tests/unit/translator-resp-openai-to-claude.test.ts \
            tests/unit/api-key-catalog-scope.test.ts \
            tests/unit/models-catalog-combo-access.test.ts \
            tests/unit/response-model-echo-1311.test.ts \
            tests/unit/opencode-free-tier-combo-scoped-failure-14313.test.ts \
            tests/unit/opencode-free-tier-noauth-ttl-skip-14313.test.ts \
            tests/unit/nvidia-quota-phase1.test.ts \
            tests/unit/nvidia-tool-compatibility-2840.test.ts \
            tests/unit/proxyfetch-direct-response-start-timeout-10214.test.ts \
            tests/unit/rate-limit-provider-default.test.ts

      - name: Typecheck touched runtime files
        run: npm run typecheck:core
